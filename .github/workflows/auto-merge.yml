name: Auto Merge Development to Production

on:
  push:
    branches:
      - development

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Fetch all branches to ensure we know about the remote 'production' branch
      - name: Fetch all branches
        run: git fetch --all

      # Check if 'production' branch exists on remote and handle it accordingly
      - name: Checkout production branch (create if not exists)
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/production; then
            git checkout production
            git pull origin production
          else
            git checkout -b production
            git push origin production
          fi

      # Merge 'development' into 'production' with --allow-unrelated-histories flag
      - name: Merge development into production
        run: |
          git checkout production
          git merge development --no-ff --allow-unrelated-histories

      # Push the updated production branch to the remote repository
      - name: Push to production
        run: git push origin production

      - name: Notify Success
        if: ${{ success() }}
        run: echo "Successfully merged development into production!"
