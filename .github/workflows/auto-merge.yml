name: Auto Merge Development to Production

on:
  push:
    branches:
      - development  # This triggers the workflow when a push occurs on the 'development' branch

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Setup Git for merging
      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Merge the development branch into the production branch
      - name: Merge to Production
        run: |
          git checkout production
          git merge development --no-ff
          git push origin production

      # Optional: Notify on success
      - name: Notify Success
        if: ${{ success() }}
        run: echo "Successfully merged development into production!"