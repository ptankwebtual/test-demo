name: Sync Development to Production

# Trigger this action on push to the 'development' branch
on:
  push:
    branches:
      - development

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code from the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Set up Git credentials for the action
      - name: Set up Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Fetch all branches to ensure 'production' is available
      - name: Fetch all branches
        run: git fetch --all

      # Checkout the production branch
      - name: Checkout production branch
        run: |
          git checkout production || git checkout -b production

      # Pull latest changes from the development branch into production with --allow-unrelated-histories
      - name: Git pull from development branch
        run: git pull origin development --ff-only

      # Push the updated production branch back to the repository
      - name: Push changes to production
        run: git push origin production
