name: Auto Merge Development to Production

on:
  push:
    branches:
      - development

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create production branch if it doesn't exist
        run: |
          if ! git rev-parse --verify origin/production; then
            git checkout -b production
            git push origin production
          else
            git checkout production
          fi

      - name: Merge development into production
        run: |
          git merge development --no-ff
          git push origin production

      - name: Notify Success
        if: ${{ success() }}
        run: echo "Successfully merged development into production!"
